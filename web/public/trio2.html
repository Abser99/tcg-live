<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Simulación · Vendedor + 2 Clientes</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0b0f; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header { padding: 7px 14px; border-bottom: 1px solid rgba(255,255,255,.12); }
  header h1 { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  header p  { margin: 2px 0 0; font-size: 10px; color: rgba(255,255,255,.5); }
  .stage { flex: 1; display: flex; gap: 12px; justify-content: center; padding: 10px; min-height: 0; }
  .phone { display: flex; flex-direction: column; min-height: 0; }
  .label {
    display: flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; margin: 0 auto 6px; width: fit-content; white-space: nowrap;
  }
  .seller { background: rgba(255,203,5,.16); border: 1px solid #FFCB05; color: #FFCB05; }
  .buyer  { background: rgba(96,165,250,.16); border: 1px solid #60a5fa; color: #93c5fd; }
  .buyer2 { background: rgba(52,211,153,.16); border: 1px solid #34d399; color: #6ee7b7; }
  .frame {
    width: 384px; flex: 1; min-height: 0;
    border-radius: 24px; overflow: hidden; background: #000;
    border: 3px solid rgba(255,255,255,.16);
    box-shadow: 0 14px 44px rgba(0,0,0,.6);
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <header>
    <h1>SIMULACIÓN · VENDEDOR + 2 CLIENTES</h1>
    <p>Tres sesiones independientes por proxy (:3200 vendedor · :3100 cliente 1 · :3400 cliente 2) — misma subasta</p>
  </header>
  <div class="stage">
    <div class="phone">
      <div class="label seller">🧑‍💼 Vendedor · tcg_master_mx</div>
      <div class="frame"><iframe id="s1" title="Vendedor" allow="clipboard-write; clipboard-read; camera; microphone; autoplay"></iframe></div>
    </div>
    <div class="phone">
      <div class="label buyer">🛒 Cliente 1 · ana_collector</div>
      <div class="frame"><iframe id="b1" title="Cliente 1" allow="clipboard-write; clipboard-read; camera; microphone; autoplay"></iframe></div>
    </div>
    <div class="phone">
      <div class="label buyer2">🛒 Cliente 2 · luis_pkmn</div>
      <div class="frame"><iframe id="b2" title="Cliente 2" allow="clipboard-write; clipboard-read; camera; microphone; autoplay"></iframe></div>
    </div>
  </div>
<script>
  const p = new URLSearchParams(location.search);
  const a = p.get('a') || 'ea416b62-5901-474e-8e7f-1ada003a24cd'; // the seller's auction — everyone here
  document.getElementById('s1').src = 'http://localhost:3200/auctions/' + a; // seller  (proxy)
  document.getElementById('b1').src = 'http://localhost:3100/auctions/' + a; // buyer 1 (proxy)
  document.getElementById('b2').src = 'http://localhost:3400/auctions/' + a; // buyer 2 (proxy)
</script>
</body>
</html>
