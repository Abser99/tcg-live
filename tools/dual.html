<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Simulación · Vendedor vs Cliente</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0b0b0f; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header { padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,.12); }
  header h1 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .04em; }
  header p  { margin: 2px 0 0; font-size: 11px; color: rgba(255,255,255,.5); }
  .stage { flex: 1; display: flex; gap: 16px; justify-content: center; padding: 12px; min-height: 0; }
  .phone { display: flex; flex-direction: column; min-height: 0; }
  .label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; margin: 0 auto 8px; width: fit-content;
  }
  .seller { background: rgba(255,203,5,.16); border: 1px solid #FFCB05; color: #FFCB05; }
  .buyer  { background: rgba(96,165,250,.16); border: 1px solid #60a5fa; color: #93c5fd; }
  .frame {
    width: 390px; flex: 1; min-height: 0;
    border-radius: 26px; overflow: hidden; background: #000;
    border: 3px solid rgba(255,255,255,.16);
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
  }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <header>
    <h1>SIMULACIÓN DE SUBASTA</h1>
    <p>Dos sesiones independientes (orígenes distintos: localhost y 127.0.0.1)</p>
  </header>
  <div class="stage">
    <div class="phone">
      <div class="label seller">🧑‍💼 Vendedor · tcg_master_mx</div>
      <div class="frame"><iframe id="sellerFrame" title="Vendedor" allow="clipboard-write; clipboard-read; camera; microphone; autoplay"></iframe></div>
    </div>
    <div class="phone">
      <div class="label buyer">🛒 Cliente · ana_collector</div>
      <div class="frame"><iframe id="buyerFrame" title="Cliente"></iframe></div>
    </div>
  </div>
<script>
  // The auction to simulate; override with ?a=<auctionId>
  const params = new URLSearchParams(location.search);
  const auctionId = params.get('a') || 'fe5bf0e3-1de1-414a-8ba1-f24e8420e95d';
  const path = '/auctions/' + auctionId;
  // Different origins keep the two localStorage sessions apart.
  // Both sides run through their own session-seeding proxy so neither depends on
  // the browser's own login: :3200 seeds the seller, :3100 seeds the buyer.
  document.getElementById('sellerFrame').src = 'http://localhost:3200' + path;
  document.getElementById('buyerFrame').src  = 'http://localhost:3100' + path;
</script>
</body>
</html>
